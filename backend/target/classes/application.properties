spring.application.name=imperial-time-backend

# Server Configuration — PORT env var injected by Railway
server.port=${PORT:8084}

# MySQL Database Configuration — use env vars on production
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/imperialdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME:imperialuser}
spring.datasource.password=${DATABASE_PASSWORD:Sam@2003}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring Security
spring.security.filter.dispatcher-types=REQUEST,ERROR,FORWARD,INCLUDE

# Logging
logging.level.root=INFO
logging.level.com.imperialtime=DEBUG
logging.level.org.springframework.security=DEBUG
