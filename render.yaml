services:
  - type: web
    name: imperial-time-project
    runtime: java
    runtimeVersion: 21
    buildCommand: cd backend && mvn clean package -DskipTests -q && cd ..
    startCommand: java -jar backend/target/imperial-time-backend-1.0.0.jar
    envVars:
      - key: PORT
        value: 8084
      - key: DATABASE_URL
        fromDatabase:
          name: mysql
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: mysql
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: mysql
          property: password
